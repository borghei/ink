name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ink-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: ink-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ink-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ink-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ink-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/ink ${{ matrix.artifact }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: mv target/${{ matrix.target }}/release/ink.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Package the Linux binaries as .deb/.rpm so apt/dnf users get a real
  # install (binary in PATH, clean uninstall) instead of a bare binary. Runs
  # before `release` so SHA256SUMS covers the packages too.
  packages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Install nfpm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo goreleaser/nfpm --json tagName -q .tagName)
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/${tag}/nfpm_${tag#v}_amd64.deb" -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build deb and rpm packages
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for pair in "amd64:ink-linux-amd64" "arm64:ink-linux-arm64"; do
            ARCH="${pair%%:*}"
            BINARY="${pair##*:}"
            # nfpm does not expand env vars in `contents.src`, so stage the
            # arch-specific artifact under the fixed name nfpm.yaml expects.
            cp "$BINARY" ink
            chmod +x ink
            for fmt in deb rpm; do
              VERSION="$VERSION" ARCH="$ARCH" \
                nfpm package -f packaging/nfpm.yaml -p "$fmt"
            done
          done
          rm -f ink
          ls -l ink-md*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            ink-md*.deb
            ink-md*.rpm

  release:
    needs: [build, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: shasum -a 256 ink-* > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ink-*
            SHA256SUMS
          generate_release_notes: true

  # Publish the crate so `cargo install ink-md` (and mise's cargo backend)
  # track releases instead of going stale (issue #4: crates.io sat at 0.2.1
  # while binaries reached 0.6.x). Skips cleanly when the token secret is
  # absent; never fails the release — the binaries have already published.
  crates:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "No CRATES_IO_TOKEN secret — skipping crates.io publish."
            exit 0
          fi
          cargo publish

  # Bump the Homebrew tap formula in the same run. Chaining via `needs` (rather
  # than a `release: published` trigger on homebrew.yml) is deliberate: releases
  # created with the default GITHUB_TOKEN do not emit events that trigger other
  # workflows, so a `release`-triggered bump would silently never fire.
  #
  # The bump is made non-blocking inside homebrew.yml (its step is
  # continue-on-error): a missing/expired HOMEBREW_TAP_TOKEN fails the bump but
  # not the release, since the binaries + checksums have already published.
  # (`continue-on-error` is not valid on a reusable-workflow-call job, so the
  # tolerance lives on the step instead.)
  homebrew:
    needs: release
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
