name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ink-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: ink-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ink-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ink-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ink-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/ink ${{ matrix.artifact }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: mv target/${{ matrix.target }}/release/ink.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: shasum -a 256 ink-* > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ink-*
            SHA256SUMS
          generate_release_notes: true

  # Bump the Homebrew tap formula in the same run. Chaining via `needs` (rather
  # than a `release: published` trigger on homebrew.yml) is deliberate: releases
  # created with the default GITHUB_TOKEN do not emit events that trigger other
  # workflows, so a `release`-triggered bump would silently never fire.
  #
  # continue-on-error: the tap bump needs a valid HOMEBREW_TAP_TOKEN secret. If
  # it's missing/expired the bump fails, but the release itself (binaries +
  # checksums) has already published, so a tap failure must not fail the run.
  # Fix the token and re-run this job to update the formula.
  homebrew:
    needs: release
    continue-on-error: true
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
