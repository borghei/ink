name: Update Homebrew Formula

on:
  # Called automatically by the Release workflow after a tag is published.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to bump (e.g. v0.2.2)'
        required: true
        type: string
  # Manual fallback — re-bump the tap for an existing release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to bump (e.g. v0.2.2)'
        required: true
        type: string

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      # We edit and push the formula directly instead of using
      # action-homebrew-bump-formula: that action runs `brew developer on`,
      # which (since Homebrew's tap-trust change) refuses to load formulae
      # from third-party taps with an UntrustedTapError. A plain file edit
      # sidesteps `brew` entirely and never hits the trust check.
      - name: Bump tap formula
        # Pushes with a deploy key that can write to borghei/homebrew-tap and
        # nothing else (secret HOMEBREW_TAP_DEPLOY_KEY; public half is a
        # read-write deploy key on the tap). No personal access token, so there
        # is nothing to expire. A failure here is real and fails the job: the
        # binaries have already published, so fix the cause and re-run this
        # workflow by hand with the tag (workflow_dispatch).
        env:
          TAG: ${{ inputs.tag }}
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "Bumping borghei/tap ink formula to ${VERSION}"

          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY secret is not set; cannot bump the tap."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy_key -o IdentitiesOnly=yes"

          git clone git@github.com:borghei/homebrew-tap.git tap
          F=tap/Formula/ink.rb

          # Bump the version field and the version embedded in every download URL.
          sed -i -E "s#version \"[0-9]+\.[0-9]+\.[0-9]+\"#version \"${VERSION}\"#" "$F"
          sed -i -E "s#/releases/download/v[0-9]+\.[0-9]+\.[0-9]+/#/releases/download/v${VERSION}/#g" "$F"

          # Recompute each platform's sha256 from the published release asset and
          # replace the sha256 line that immediately follows its url line.
          for plat in macos-arm64 macos-amd64 linux-arm64 linux-amd64; do
            url="https://github.com/borghei/ink/releases/download/v${VERSION}/ink-${plat}"
            curl -fsSL "$url" -o "/tmp/ink-${plat}"
            sha="$(sha256sum "/tmp/ink-${plat}" | cut -d' ' -f1)"
            perl -0777 -pi -e "s/(ink-${plat}\"\s*\n\s*sha256 \")[0-9a-f]{64}/\${1}${sha}/" "$F"
          done

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            # Still prove the key can write, so a broken key is found now and
            # not at the next release.
            git push --dry-run origin HEAD
            echo "Formula already up to date — nothing to push."
            exit 0
          fi
          git commit -am "ink ${VERSION}"
          git push
